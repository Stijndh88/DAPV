# Production stack for plasvissers.be
#
#   app     Next.js + Payload CMS (image built by GitHub Actions, see .github/workflows)
#   db      PostgreSQL 17 (never exposed to the internet)
#   caddy   Reverse proxy with automatic HTTPS (Let's Encrypt)
#   backup  Nightly pg_dump + media archive with retention, optional offsite sync
#
# Usage (on the server, in /opt/plasvissers/infra):
#   cp .env.example .env && nano .env
#   docker compose pull && docker compose up -d
#
# Everything that must survive a rebuild lives in named volumes or ./backups.

name: plasvissers

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/stijndh88/dapv}:${APP_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      media-perms:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URI: postgres://${POSTGRES_USER:-plasvissers}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-plasvissers}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      NEXT_PUBLIC_SERVER_URL: ${SITE_URL:-https://plasvissers.be}
      MEDIA_DIR: /app/media
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - media:/app/media
    networks: [internal, web]
    healthcheck:
      # /api/health returns 200 only when the app can reach the database.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # The app runs as a non-root user; make sure it can write uploads to the media volume.
  media-perms:
    image: plasvissers-backup:local
    build: ./backup
    restart: "no"
    entrypoint: ["sh", "-c", "chown -R ${APP_UID:-1001}:${APP_GID:-1001} /media"]
    volumes:
      - media:/media
    network_mode: none

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plasvissers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-plasvissers}
      TZ: Europe/Brussels
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-plasvissers.be}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./redirects.caddy:/etc/caddy/redirects.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    logging: *default-logging

  backup:
    build: ./backup
    image: plasvissers-backup:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-plasvissers}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-plasvissers}
      TZ: Europe/Brussels
      BACKUP_CRON: ${BACKUP_CRON:-30 3 * * *}
      KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
    volumes:
      - media:/media:ro
      - ./backups:/backups
      - ./rclone:/config/rclone:ro
    networks: [internal, web] # web gives egress for offsite sync + ping URL
    logging: *default-logging

  # One-off tool, never started by `up`. Used by scripts/restore.sh.
  restore:
    profiles: [tools]
    image: plasvissers-backup:local
    build: ./backup
    entrypoint: ["/usr/local/bin/restore.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-plasvissers}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-plasvissers}
    volumes:
      - media:/media
      - ./backups:/backups
    networks: [internal]

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true # no internet route; only db lives here exclusively
  web:
