name: App image

# Builds the Next.js + Payload image from ./app and pushes it to GitHub Container Registry.
# On main it can also deploy to the server (off until the DEPLOY_ENABLED variable is "true").

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-image.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-image.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after building"
        type: boolean
        default: true

concurrency:
  group: app-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the app has a Dockerfile
        id: check
        run: |
          if [ -f app/Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::app/Dockerfile not found yet, skipping image build"; echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Compute tag
        id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.present == 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.present == 'true' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        if: steps.check.outputs.present == 'true'
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.present == 'true'
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in repo settings for a manual "approve deploy" button.
    environment:
      name: production
      url: https://plasvissers.be
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
          TAG: ${{ needs.build.outputs.tag }}
        run: ssh -o BatchMode=yes "$USER@$HOST" "/opt/plasvissers/infra/scripts/deploy.sh $TAG"

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://plasvissers.be/) && [ "$code" = 200 ] && exit 0
            sleep 6
          done
          echo "site did not return 200"; exit 1
