name: Infra checks

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Compose file is valid
        run: cp .env.example .env && docker compose config -q && docker compose --profile tools config -q

      - name: Caddyfile is valid
        run: |
          docker run --rm -e SITE_DOMAIN=plasvissers.be -e ACME_EMAIL=ci@example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/redirects.caddy:/etc/caddy/redirects.caddy:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Shell scripts pass shellcheck
        run: shellcheck -S warning -x scripts/*.sh backup/*.sh

      - name: Backup image builds
        run: docker build -t plasvissers-backup:ci ./backup
